# Cloudflare Worker for varslene (påmelding, avmelding, Stripe-webhook og abonnentlisten for utsendingen).
# Oppsett: se worker/README.md.
name = "kronesporet-varsler"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
SITE_URL = "https://kronesporet.no"
AVSENDER = "varsler@kronesporet.no"
# Stripe Payment Link og kundeportal for abonnementet. Worker-en bruker live-lenkene så snart live-webhooken finnes
# (hemmeligheten STRIPE_WEBHOOK_SECRET_LIVE, lages av worker.yml når STRIPE_LIVE_KEY er i GitHub), ellers sandkassen.
# Tom betalingslenke = bekreftede abonnenter venter på betaling.
STRIPE_PAYMENT_LINK = "https://buy.stripe.com/test_bJe3cnalvcydaqMcB37Re00"
STRIPE_PORTAL_URL = "https://billing.stripe.com/p/login/test_bJe3cnalvcydaqMcB37Re00"
# Live: betalingslenken er laget i Stripe-dashbordet (14 dager gratis, deretter 490 kr i måneden).
STRIPE_PAYMENT_LINK_LIVE = "https://buy.stripe.com/8x200bgH06sFeARgnC5sA01"
STRIPE_PORTAL_URL_LIVE = ""

[[d1_databases]]
binding = "DB"
database_name = "kronesporet-varsler"
database_id = "FYLL-INN-FRA-wrangler-d1-create"

# Hemmeligheter (ikke her, legges inn av .github/workflows/worker.yml): API_TOKEN, SMTP_HOST/SMTP_USER/SMTP_PASSWORD
# eller BREVO_API_KEY, STRIPE_WEBHOOK_SECRET (sandkasse) og STRIPE_WEBHOOK_SECRET_LIVE
